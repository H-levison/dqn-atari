[project]
name = "dqn-atari"
version = "0.1.0"
description = "A DQN agent implemented from scratch and trained on ALE/Pong-v5"
requires-python = ">=3.10"
dependencies = [
    "ale-py>=0.10.1",
    "gymnasium[atari]>=1.0.0",
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "opencv-python>=4.10.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
]

# PyPI ships a CPU-only torch on Windows, which makes training roughly fifty
# times slower. Take torch from the CUDA 12.6 index on Windows and Linux, and
# leave macOS on the default PyPI build.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
